name: Zen with Liquid Glass (macOS arm64)

# Builds Zen for Apple Silicon with the Liquid Glass window materials from
# glass/apply_glass.py, on GitHub's free runners: cross-compiled on Linux like
# Zen's own release builds, then signed and notarized on macOS when the
# PROD_MACOS_* secrets are set (ad-hoc signed otherwise).

on:
  workflow_dispatch:
    inputs:
      zen-version:
        description: "Zen version being built (display version)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Cross-compile Zen ${{ inputs.zen-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: "true"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      SURFER_COMPAT: aarch64
      SURFER_PLATFORM: darwin
      ZEN_CROSS_COMPILING: 1
      ZEN_GA_DISABLE_PGO: 1
      ZEN_DISABLE_LTO: 1
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Expose actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip zstd yasm nasm build-essential libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev xvfb --fix-missing

      - name: Load Surfer CI setup
        run: npm run surfer -- ci --brand release --display-version ${{ inputs.zen-version }}

      - name: Download Firefox and dependencies
        run: npm run download

      - name: mac-cross cache
        id: cache-mac-cross
        uses: actions/cache@v4
        with:
          path: ~/mac-cross
          key: mac-cross

      - name: Setup for macOS (cctools and DMG tools)
        if: steps.cache-mac-cross.outputs.cache-hit != 'true'
        run: |
          set -ex
          mkdir -p ~/mac-cross
          cd engine/
          ./mach artifact toolchain --from-build linux64-cctools-port linux64-libdmg linux64-hfsplus
          mv cctools dmg hfsplus ~/mac-cross/

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(cat .rust-toolchain)
          source $HOME/.cargo/env
          rustup target add aarch64-apple-darwin

      - name: Import
        run: |
          . "$HOME/.cargo/env"
          npm run import -- --verbose

      - name: Apply Liquid Glass
        run: |
          . "$HOME/.cargo/env"
          python3 glass/apply_glass.py .
          npm run ffprefs
          # Zen's updater would replace this build with stock Zen.
          echo 'ac_add_options --disable-updater' >> configs/common/mozconfig

      - name: Bootstrap
        run: npm run bootstrap

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Build
        run: bash .github/workflows/src/release-build.sh

      - name: Package
        run: |
          export ZEN_RELEASE=1
          # Surfer copies the dmg to dist/ and then builds an update .mar, which
          # needs a host `mar` tool this cross-build lacks. The fork has no
          # auto-updater, so only the dmg matters.
          npm run package || echo "::warning::npm run package failed after the dmg step (expected: no host mar tool)"
          mv ./dist/*.dmg ./zen-unsigned.dmg

      - name: Upload unsigned dmg
        uses: actions/upload-artifact@v4
        with:
          retention-days: 2
          name: zen-unsigned
          path: ./zen-unsigned.dmg

  sign:
    name: Sign and notarize
    needs: build
    runs-on: macos-26
    steps:
      - name: Download unsigned dmg
        uses: actions/download-artifact@v4
        with:
          name: zen-unsigned

      - name: Sign, notarize and repackage
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          ZEN_VERSION: ${{ inputs.zen-version }}
        run: |
          set -euo pipefail
          hdiutil attach -nobrowse -readonly zen-unsigned.dmg -mountpoint "$RUNNER_TEMP/zen"
          APP_NAME=$(basename "$(find "$RUNNER_TEMP/zen" -maxdepth 1 -name '*.app' | head -1)")
          ditto "$RUNNER_TEMP/zen/$APP_NAME" "$APP_NAME"
          hdiutil detach "$RUNNER_TEMP/zen"
          xattr -cr "$APP_NAME"

          if [ -n "$MACOS_CERTIFICATE" ]; then
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"

            # Zen's own entitlements, minus those that need Zen's provisioning
            # profile (application-identifier, browser passkeys).
            cat > child.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
          </dict></plist>
          EOF
            cat > app.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
            <key>com.apple.security.device.audio-input</key><true/>
            <key>com.apple.security.device.camera</key><true/>
            <key>com.apple.security.device.usb</key><true/>
            <key>com.apple.security.personal-information.location</key><true/>
            <key>com.apple.security.smartcard</key><true/>
          </dict></plist>
          EOF
            sign() { codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$MACOS_CERTIFICATE_NAME" "$@"; }
            # Inside out: loose Mach-O files, then nested bundles, then the app.
            find "$APP_NAME/Contents" -type f \( -name '*.dylib' -o -perm -u+x \) -print0 |
              while IFS= read -r -d '' f; do
                if file -b "$f" | grep -q Mach-O; then sign --entitlements child.plist "$f"; fi
              done
            find "$APP_NAME/Contents" -depth -type d \( -name '*.app' -o -name '*.framework' \) -print0 |
              while IFS= read -r -d '' b; do sign --entitlements child.plist "$b"; done
            sign --entitlements app.plist "$APP_NAME"
            codesign --verify --deep --strict --verbose=2 "$APP_NAME"

            ditto -c -k --keepParent "$APP_NAME" notarize.zip
            xcrun notarytool submit notarize.zip \
              --apple-id "$NOTARIZATION_APPLE_ID" \
              --team-id "$NOTARIZATION_TEAM_ID" \
              --password "$NOTARIZATION_PWD" \
              --wait
            xcrun stapler staple "$APP_NAME"
            security delete-keychain "$KEYCHAIN"
          else
            echo "::warning::PROD_MACOS_CERTIFICATE is not set; ad-hoc signing"
            codesign --force --deep --sign - "$APP_NAME"
          fi

          hdiutil create -volname Zen -srcfolder "$APP_NAME" -ov -format UDZO "zen-glass-$ZEN_VERSION-macos-aarch64.dmg"

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: zen-glass-${{ inputs.zen-version }}-macos-aarch64
          path: ./zen-glass-*.dmg
